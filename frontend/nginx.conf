server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/problem+json image/svg+xml;

    # A barra final no proxy_pass troca "/api/" por "/": /api/requests/1 chega ao back como /requests/1
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (outputHashing: all) podem ficar em cache para sempre
    location ~* \.(?:js|css|woff2?|ttf|ico|png|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Rotas do Angular (/requests/42, /approvals/inbox) caem no index.html; ele nunca vai para cache
    # para que um novo deploy seja percebido no próximo carregamento
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
