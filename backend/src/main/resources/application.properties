spring.application.name=purchase

server.port=${SERVER_PORT:8080}

# Datasource (defaults apontam para o Postgres local do docker compose; somente desenvolvimento)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/purchase}
spring.datasource.username=${DB_USER:purchase}
spring.datasource.password=${DB_PASSWORD:purchase}

# JPA: schema gerenciado exclusivamente pelo Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.locations=classpath:db/migration

# Logs estruturados (ECS); o MDC (requestId) sai como campo de cada linha
logging.structured.format.console=ecs

# Actuator na raiz: apenas /health (com checagem do banco); nenhum outro endpoint exposto
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui

# JWT HS256. O default é EXCLUSIVAMENTE de desenvolvimento; fora do ambiente local defina JWT_SECRET
# com pelo menos 32 bytes aleatórios (ex.: openssl rand -base64 48)
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-0123456789}
app.security.jwt.ttl=${JWT_TTL_MINUTES:15}m

# Seed com dados fictícios (README 5.4): desligado por padrão; o docker compose o liga. Só roda com o banco sem usuários
app.seed.enabled=${SEED_ENABLED:false}
