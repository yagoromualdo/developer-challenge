name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build, test and verify
        run: ./mvnw -B verify

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Sem isso, a CLI do Angular pode perguntar sobre analytics e travar o job
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          # Mesma major do Dockerfile do front-end (node:26-alpine)
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  compose-smoke:
    name: compose-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Só sobe a stack se o código passou nos jobs de build/teste: evita gastar minutos com imagem quebrada
    needs: [backend, frontend]
    env:
      # Credenciais fictícias do seed (SEED_ENABLED=true no compose); nada aqui é segredo real
      SMOKE_EMAIL: solicitante.ti@example.com
      SMOKE_PASSWORD: Senha@123
      FRONTEND_URL: http://localhost:4200
      BACKEND_URL: http://localhost:8080
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and start the stack
        # --wait bloqueia até todos os serviços ficarem healthy (db, backend e frontend têm healthcheck)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Wait for /health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/health" | jq -e '.status == "UP"' > /dev/null; then
              echo "Back-end healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health did not report UP in time"
          exit 1

      - name: Front-end serves the app and proxies /api
        run: |
          curl -fsS "$FRONTEND_URL/" | grep -qi '<app-root'
          # Rota do Angular deve cair no index.html (try_files do nginx)
          curl -fsS "$FRONTEND_URL/requests/1" | grep -qi '<app-root'
          curl -fsS "$FRONTEND_URL/api/health" | jq -e '.status == "UP"' > /dev/null

      - name: Log in through the front-end proxy and call an authenticated endpoint
        run: |
          body=$(jq -n --arg email "$SMOKE_EMAIL" --arg password "$SMOKE_PASSWORD" \
            '{email: $email, password: $password}')
          token=$(curl -fsS -X POST "$FRONTEND_URL/api/auth/login" \
            -H 'Content-Type: application/json' -d "$body" | jq -er '.accessToken')
          echo "::add-mask::$token"
          curl -fsS "$FRONTEND_URL/api/auth/me" -H "Authorization: Bearer $token" \
            | jq -e --arg email "$SMOKE_EMAIL" '.email == $email' > /dev/null
          echo "Login OK for $SMOKE_EMAIL"

      - name: Show service logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
